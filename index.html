<style>
:root{--paper:#f7f3e9;--paper2:#eee7d8;--ink:#302f2a;--muted:#817c70;--line:#ded7c7;--gold:#c8963b;--serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.page{width:min(1240px,calc(100% - 80px));margin:auto}.hero{display:flex;align-items:center;gap:34px;padding:50px 0 38px}.mark{width:150px;height:150px;flex:none}.eyebrow{margin:0;color:var(--gold);font-size:12px;letter-spacing:.22em}h1,h2,h3{font-family:var(--serif);font-weight:500}h1{margin:0;font-size:clamp(42px,5vw,62px);letter-spacing:.1em;line-height:1.25}.intro{margin:10px 0 0;color:var(--muted);font:17px var(--serif);letter-spacing:.06em}.rule{height:1px;background:var(--line)}nav{display:flex;gap:14px;align-items:center;padding:16px 0 20px;font:18px var(--serif);letter-spacing:.08em}nav .dot{color:var(--gold);font-size:13px}nav a:hover,.back:hover{color:var(--gold)}.head{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}.head h2{margin:0;font-size:24px;letter-spacing:.08em}.head span{color:var(--muted);font-size:12px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{min-width:0}.art{height:210px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;transition:.25s}.art svg{width:100%;height:100%;display:block}.card:hover .art{transform:translateY(-4px);box-shadow:0 12px 28px #302f2a18}.label{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px}.label b{font:24px var(--serif);font-weight:500;letter-spacing:.12em}.label small{font-size:12px;color:var(--muted)}.recent{margin-top:48px}.entry{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:16px 0;border-top:1px solid var(--line)}time{font-size:12px;color:var( <script>
