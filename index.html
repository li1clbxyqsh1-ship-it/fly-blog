<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞的日常</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #292820;
      background: #f8f7f3;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    main { width: min(720px, 88%); margin: 80px auto; }
    header { margin-bottom: 64px; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: 42px; }
    .subtitle { color: #77766f; margin-top: 8px; }
    nav { margin-top: 22px; color: #77766f; font-size: 14px; }
    nav a { color: inherit; text-decoration: none; margin-right: 18px; }
    article {
      padding: 28px 0;
      border-top: 1px solid #e4e1d8;
    }
    time, .tag { color: #89877f; font-size: 13px; }
    h2 { margin: 8px 0; font-size: 23px; }
    article p { color: #55544d; margin-bottom: 0; }
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #e4e1d8;
      color: #89877f;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>飞的日常</h1>
      <div class="subtitle">写生活，写思考，也写那些不想忘记的小事。</div>
      <nav><a href="#文章">文章</a><a href="#关于">关于</a></nav>
    </header>

    <section id="文章">
      <article>
        <time>2026 年 11 月 17 日</time>
        <h2>这里是我的第一篇文章</h2>
        <div class="tag">生活 · 随笔</div>
        <p>欢迎来到我的小小角落。以后我会在这里记录生活里的发现、感受和想法。</p>
      </article>
    </section>

    <footer id="关于">这是飞的个人博客。慢慢写，慢慢更新。</footer>
  </main>
</body>
</html>
