<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>上线状态 · 闻日光</title><style>body{margin:0;background:#f7f4ec;color:#292820;font:17px/1.9 'Songti SC',Georgia,serif}main{max-width:700px;margin:10vh auto;padding:0 24px}h1{font-size:32px;font-weight:500}p{color:#827a6d}button,a{font:inherit;color:#96701f}button{background:none;border:1px solid #dbd3c4;padding:8px 22px;cursor:pointer}nav{display:flex;gap:26px;margin-top:30px}small{font-size:13px;color:#827a6d}</style></head><body><main><h1>闻日光 · 上线状态</h1><p id="status" role="status">正在检查…</p><small id="version"></small><nav><button id="refresh">重新检查</button><a href="./">查看博客</a><a href="admin/">返回管理</a></nav></main><script>
'use strict';
async function check(){const s=document.getElementById('status'),b=document.getElementById('refresh');b.disabled=true;s.textContent='正在检查…';try{const current=await fetch('build.json?check='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('尚未找到上线版本记录');return r.json()});document.getElementById('version').textContent='当前上线版本：'+current.revision.slice(0,7);let head;try{head=await fetch('https://api.github.com/repos/li1clbxyqsh1-ship-it/fly-blog/commits/main',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()})}catch{s.textContent='可以读取当前上线版本；仓库状态暂时无法查询，请稍后重新检查。';return}if(current.revision===head.sha){s.textContent='最新版本已上线，可以打开博客查看。';return}const jobs=await fetch('https://api.github.com/repos/li1clbxyqsh1-ship-it/fly-blog/actions/runs?head_sha='+head.sha).then(r=>{if(!r.ok)throw Error();return r.json()});const run=jobs.workflow_runs?.find(r=>r.name==='Publish blog content');s.textContent=run?.conclusion&&run.conclusion!=='success'?'此次更新未能上线，博客仍保留上一个版本。请保留草稿并联系维护。':'内容已提交，网站正在更新，稍后点击重新检查。'}catch(e){s.textContent=e.message||'暂时无法检查，请稍后重试。'}finally{b.disabled=false}}
document.getElementById('refresh').onclick=check;check();
</script></body></html>
